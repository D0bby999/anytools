name: Images

# Builds the api and web images on every pull request and every push to main.
# Only main pushes them, to ghcr.io/<owner>/anytools-api and -web, tagged
# sha-<short commit> and latest. On main this runs from deploy.yml, whose last
# job has the server pull the sha- tag; nothing is compiled on the host
# (deploy/coolify/docker-compose.yml).
on:
  pull_request:
  workflow_call:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN is the only credential: packages: write lets it push to the
# repository owner's GHCR namespace. A fork's pull request gets a read-only
# token, and pushes nothing anyway.
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: deploy/Dockerfile.api
          - image: web
            context: ui/web
            file: ui/web/Dockerfile

    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7

      # GHCR names must be lower-case; the owner is D0bby999.
      - name: Image name
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/anytools-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.repo }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ env.PUSH == 'true' }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The API binary reports this from `anytools version`.
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
