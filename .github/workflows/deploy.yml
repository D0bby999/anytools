# Build the AnyTools image on a GitHub runner and have Coolify adopt it.
#
# Single-app version of the workflow this project used while it lived in the
# dobby-platform monorepo. Registry, image name and Coolify application UUID are
# deliberately unchanged, so the running deployment does not need recreating.
#
# How the deploy actually works (read from the Coolify DB, 2026-09-01 — an earlier
# version of this comment guessed `build_pack=dockerimage` and was wrong):
#
#   applications.build_pack         = dockerfile
#   applications.dockerfile_location= /apps/anytools-web/Dockerfile.deploy
#   applications.git_repository     = <must be repointed to D0bby999/anytools>
#
# So Coolify CLONES this repo and "builds" Dockerfile.deploy, which is a single
# `FROM ghcr.io/d0bby999/anytools-web:latest` — no compile, so the 4GB server can
# never OOM. The catch is that `:latest` is a MUTABLE tag: without a fresh pull on
# the host first, that FROM resolves from the host's local Docker cache and the
# deploy silently ships the PREVIOUS image while reporting success. Hence the
# explicit `docker pull` over SSH before every Coolify call.
name: Build image (CI) + deploy

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: After build, tell Coolify to pull + redeploy (turn OFF for build-only)
        type: boolean
        default: true

concurrency:
  group: ci-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: d0bby999
  APP: anytools-web
  COOLIFY: http://157.180.70.19:8000
  COOLIFY_APP_UUID: v5kik8xxwkh7wqlu56wq5eb2

jobs:
  # The monorepo skipped tests on the deploy path; a single-app repo can afford to
  # gate the image on them, and `go test`-style build time is not the bottleneck here.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/anytools-web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/anytools-web:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/anytools-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_URL=https://anytools.world
            NEXT_PUBLIC_UMAMI_SRC=https://stats.besttoys.world/script.js
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=d16d47ff-7cf1-4087-a01b-188ae6cd9b52
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pre-pull the fresh :latest onto the host, THEN tell Coolify to deploy. The order
  # matters: Dockerfile.deploy's `FROM …:latest` is resolved against the host's local
  # image cache, so skipping the pull produces a green deploy that serves stale code.
  deploy:
    needs: build
    if: always() && needs.build.result == 'success' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: 157.180.70.19
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Pull the new image onto the host, then redeploy
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY: ${{ env.COOLIFY }}
        run: |
          ssh -i ~/.ssh/id_ed25519 root@"$HETZNER_HOST" \
            'docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}:latest'
          bash .github/scripts/coolify-deploy-wait.sh ${{ env.COOLIFY_APP_UUID }} anytools
