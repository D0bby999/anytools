name: Deploy

# Every push to main is tested, built and, when both pass, deployed to
# anytools.world. The same shape as postclaw's deploy: CI gates the deploy,
# one deploy at a time, the server backs up before it migrates, checks health
# after, and puts the previous release back when a check fails.
#
# The server half is deploy/scripts/autodeploy.sh, installed on the host by
# deploy/scripts/install-autodeploy.sh. DEPLOY_SSH_KEY is bound there to that
# one script, so this workflow can name a commit to deploy and nothing else.
on:
  push:
    branches: [main]
    # Prose ships with nothing: neither image reads docs/ or a root *.md, so
    # a push that touches only them would restart the site for no change.
    paths-ignore:
      - "docs/**"
      - "*.md"
  # Deploys the head of main again, e.g. after the server was rebuilt.
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  images:
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to anytools.world
    needs: [test, images]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://anytools.world
    # One deploy at a time, and a running one is never cancelled: stopping it
    # between the migration and the restart is the one bad place to stop.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # The host key is pinned in a secret, not scanned here: a scan
          # would trust whatever answers at that address today.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@$DEPLOY_HOST" "$GITHUB_SHA"

      - name: Check https://anytools.world from outside
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null --max-time 15 https://anytools.world/ \
              && curl -fsS -o /dev/null --max-time 15 https://anytools.world/en; then
              echo "anytools.world answers (try $i)"
              echo "Deployed \`${GITHUB_SHA::7}\` to https://anytools.world" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "::error::anytools.world did not answer from outside after the deploy"
          exit 1
