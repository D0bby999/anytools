<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AnyTools maskable icon</title>
  <defs>
    <linearGradient id="atgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Full bleed brand gradient for OS masks (no rounded corners; OS applies mask) -->
  <rect width="512" height="512" fill="url(#atgm)"/>
  <!-- Morphing-module mark in white, centered within the safe zone (40% radius) -->
  <g fill="#FFFFFF" transform="translate(256 256) scale(3.05) translate(-60 -56)">
    <rect x="22" y="42" width="46" height="46" rx="6"  opacity="0.55" transform="rotate(-8 45 65)"/>
    <rect x="36" y="34" width="46" height="46" rx="13" opacity="0.78" transform="rotate(4 59 57)"/>
    <rect x="52" y="24" width="46" height="46" rx="23"/>
  </g>
</svg>
