<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AnyTools app-icon tile (source for raster icons)</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
  <!-- White morphing-module mark, comfortably sized for app icon / favicon -->
  <g fill="#FFFFFF" transform="translate(256 256) scale(3.9) translate(-58 -56)">
    <rect x="20" y="44" width="44" height="44" rx="5"  opacity="0.55"/>
    <rect x="34" y="34" width="44" height="44" rx="14" opacity="0.8"/>
    <rect x="48" y="24" width="44" height="44" rx="22"/>
  </g>
</svg>
